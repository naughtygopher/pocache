name: Go

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main", "maintenance"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and test (Go ${{ matrix.go }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                go: ["1.26.x", "oldstable", "stable"]
        env:
            # Ensure the compatibility jobs cannot silently select a newer Go.
            GOTOOLCHAIN: local
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ matrix.go }}

            - name: Build
              run: go build ./...

            - name: Vet
              run: go vet ./...

            - name: Test with race detection and coverage
              run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

            - name: Send coverage
              # Publish once; fork PRs still run all build and test checks.
              if: matrix.go == 'stable' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              uses: shogo82148/actions-goveralls@77a1912dca42260ee3e97f61bd13ea7ef40baa93 # v1.11.2
              with:
                  github-token: ${{ github.token }}
                  path-to-profile: coverage.out

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: stable

            - name: Check formatting
              run: test -z "$(gofmt -l .)"

            - name: golangci-lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.13.2
